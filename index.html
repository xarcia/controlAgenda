      <div>${(!isNew && !readOnly) ? `<button class="btn btn-danger" id="mDelete" type="button">Eliminar sesión</button>` : ''}</div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-ghost" id="mCancel" type="button">${readOnly?'Cerrar':'Cancelar'}</button>
        ${readOnly ? '' : `<button class="btn btn-amber" id="mSave" type="button">${isNew?'Crear sesión':'Guardar cambios'}</button>`}
      </div>
    </div>
  `;

  let attendees = session.attendees.map(a=>({...a}));
  function renderAttendees() {
    document.getElementById('attendeesEditor').innerHTML = attendees.length ? attendees.map((a,i)=>`
      <span class="attendee-chip">${esc(a.nombre)} <span class="mono" style="color:var(--text-dim)">#${a.codigo??'—'}</span> ${readOnly?'':`<button data-i="${i}" type="button">✕</button>`}</span>
    `).join('') : '<span style="color:var(--text-dim);font-size:12px;">Sin participantes todavía.</span>';
    if (!readOnly) {
      document.querySelectorAll('#attendeesEditor button').forEach(b=>{
        b.addEventListener('click', () => { attendees.splice(+b.dataset.i,1); renderAttendees(); });
      });
    }
  }
  renderAttendees();

  if (!readOnly) document.getElementById('mAddPartBtn').addEventListener('click', () => {
    const val = document.getElementById('mAddPart').value.trim();
    if (!val) return;
    const found = dir.find(p => p.nombre.toUpperCase() === val.toUpperCase());
    attendees.push(found ? { ...found } : { nombre: val.toUpperCase(), codigo: null, unidad: null });
    document.getElementById('mAddPart').value = '';
    renderAttendees();
  });

  function liveWarnCheck() {
    const fecha = document.getElementById('mFecha').value;
    const hora = document.getElementById('mHora').value;
    const horaFin = document.getElementById('mHoraFin').value;
    const cap = document.getElementById('mCap').value;
    const sala = document.getElementById('mSala').value;
    const warnBox = document.getElementById('mWarn');
    if (!fecha || !hora || !horaFin) { warnBox.innerHTML=''; return; }
    const hMin = timeToMin(hora), hfMin = timeToMin(horaFin);
    const others = STATE.sessions.filter(s => s.sessionId !== sessionId && s.fecha === fecha);
    const msgs = [];
    for (const o of others) {
      if (!overlaps(hMin,hfMin,o.horaMin,o.horaFinMin)) continue;
      if (cap && o.capacitador === cap) msgs.push(`⚠ ${cap} ya tiene "${o.tema}" (${o.hora}–${o.horaFin}) ese horario.`);
      if (sala && sala===o.sala && sala!=='POR CONFIRMAR' && sala!=='VIRTUAL') msgs.push(`⚠ La sala "${sala}" ya está reservada para "${o.tema}" (${o.hora}–${o.horaFin}).`);
    }
    warnBox.innerHTML = msgs.length ? `<div class="form-warn">${msgs.map(esc).join('<br>')}</div>` : '<div style="font-size:11.5px;color:var(--green)">Sin cruces detectados con el resto de la agenda.</div>';
  }
  if (!readOnly) {
    ['mFecha','mHora','mHoraFin','mCap','mSala'].forEach(id => document.getElementById(id).addEventListener('input', liveWarnCheck));
    liveWarnCheck();
  }

  document.getElementById('mCancel').addEventListener('click', closeModal);
  if (!isNew && !readOnly) document.getElementById('mDelete').addEventListener('click', () => {
    if (confirm('¿Eliminar esta sesión y todos sus participantes del Registro?')) { deleteSession(sessionId); closeModal(); }
  });

  if (readOnly) { document.getElementById('modalBackdrop').hidden = false; return; }

  document.getElementById('mSave').addEventListener('click', async () => {
    const fields = {
      capacitador: document.getElementById('mCap').value.trim(),
      modulo: document.getElementById('mCapModulo').value.trim(),
      tema: document.getElementById('mTema').value.trim(),
      fecha: document.getElementById('mFecha').value || null,
      hora: document.getElementById('mHora').value || null,
      horaFin: document.getElementById('mHoraFin').value || null,
      localidad: document.getElementById('mLocalidad').value.trim(),
      lugar: document.getElementById('mLugar').value.trim(),
      modalidad: document.getElementById('mModalidad').value,
      sala: document.getElementById('mSala').value,
      estado: document.getElementById('mEstado').value,
      requisitos: document.getElementById('mReq').value.trim(),
      observaciones: document.getElementById('mObs').value.trim(),
    };
    if (!fields.tema || !fields.fecha || !fields.hora) {
      alert('Completa al menos Tema, Fecha y Hora de inicio.');
      return;
    }

    const saveBtn = document.getElementById('mSave');
    const originalLabel = saveBtn.textContent;
    saveBtn.disabled = true;
    saveBtn.textContent = 'Guardando…';

    let removedIds = [];
    if (isNew) {
      let id = nextId();
      const newRows = (attendees.length?attendees:[{nombre:null,codigo:null,unidad:null}]).map(a => {
        const row = { id: id++, ...fields, nombre: a.nombre, codigo: a.codigo, unidad: a.unidad, localidad: a.localidad || fields.localidad, duracion: null };
        return row;
      });
      STATE.registro.push(...newRows);
      newRows.forEach(r => markDirty(r.id));
    } else {
      // Diff quirúrgico en vez de "borrar todo y recrear todo": a quien ya estaba se le
      // actualiza SU MISMA fila (mismo id), solo se crean filas nuevas para quien se acaba
      // de agregar, y solo se borran las filas de quien se quitó de la lista. Antes se
      // reemplazaba todo con ids nuevos aunque nadie hubiera cambiado, lo cual no tenía
      // por qué perder gente, pero sí abría una ventana innecesaria de borrar+crear que
      // no aporta nada y es más riesgosa de lo necesario.
      const originalIds = new Set(STATE.registro.filter(r => computeRowSessionId(r) === sessionId).map(r=>r.id));
      const keptIds = new Set(attendees.filter(a=>a.id!=null).map(a=>a.id));
      removedIds = [...originalIds].filter(id => !keptIds.has(id));

      let nextNewId = nextId();
      const touchedIds = [];
      for (const a of attendees) {
        if (a.id != null && originalIds.has(a.id)) {
          const row = STATE.registro.find(r => r.id === a.id);
          if (row) {
            Object.assign(row, fields, { nombre: a.nombre, codigo: a.codigo, unidad: a.unidad, localidad: a.localidad || fields.localidad });
            touchedIds.push(row.id);
          }
        } else {
          const row = { id: nextNewId++, ...fields, nombre: a.nombre, codigo: a.codigo, unidad: a.unidad, localidad: a.localidad || fields.localidad, duracion: null };
          STATE.registro.push(row);
          touchedIds.push(row.id);
        }
      }
      if (!attendees.length) {
        const row = { id: nextNewId++, ...fields, nombre: null, codigo: null, unidad: null, localidad: fields.localidad, duracion: null };
        STATE.registro.push(row);
        touchedIds.push(row.id);
      }
      touchedIds.forEach(id => markDirty(id));
      removedIds.forEach(id => STATE.dirtyIds.delete(id));
    }
    recompute();

    // Importante: se espera la confirmación REAL antes de cerrar el modal o decir
    // "guardado". Antes esto se mostraba al instante sin esperar a Supabase, lo que
    // daba una falsa sensación de seguridad si la persona recargaba la página rápido.
    let deleteOk = true;
    if (removedIds.length) deleteOk = await deleteRemote(removedIds);
    await persist(false);
    const ok = deleteOk && !STATE.lastSaveError;

    saveBtn.disabled = false;
    saveBtn.textContent = originalLabel;

    if (!ok) {
      toast('No se pudo confirmar el guardado — tus cambios siguen aquí, revisa la conexión e intenta de nuevo.');
      return; // el modal se queda abierto para no perder lo escrito
    }
    refreshActiveView();
    closeModal();
    toast(isNew ? 'Sesión creada y guardada' : 'Cambios guardados y confirmados');
  });

  document.getElementById('modalBackdrop').hidden = false;
}

function closeModal() {
  document.getElementById('modalBackdrop').hidden = true;
  STATE.editing = null;
}
function initModal() {
  document.getElementById('modalBackdrop').addEventListener('click', e => {
    if (e.target.id === 'modalBackdrop') closeModal();
  });
}

/* ============================================================
   TAB: AGENDA REUNION
   ============================================================ */
function initAgendaTab() {
  document.getElementById('agendaPrev').addEventListener('click', () => stepAgendaFecha(-1));
  document.getElementById('agendaNext').addEventListener('click', () => stepAgendaFecha(1));
  document.getElementById('btnAgendaOnlyConflicts').addEventListener('click', () => {
    STATE.agendaOnlyConflicts = !STATE.agendaOnlyConflicts;
    document.getElementById('btnAgendaOnlyConflicts').classList.toggle('active', STATE.agendaOnlyConflicts);
    renderAgenda();
  });
  document.getElementById('fModuloAgenda').addEventListener('change', (e) => {
    STATE.agendaModulo = e.target.value;
    renderAgenda();
  });
  document.getElementById('fLocalidadAgenda').addEventListener('change', (e) => {
    STATE.agendaLocalidad = e.target.value;
    renderAgenda();
  });
  document.getElementById('fEstadoAgenda').addEventListener('change', (e) => {
    STATE.agendaEstado = e.target.value;
    renderAgenda();
  });
  document.getElementById('temaSearch').addEventListener('input', (e) => renderTemaSearchResults(e.target.value));
  document.getElementById('btnNuevaSesion').addEventListener('click', () => openSessionModal('new'));
  document.getElementById('btnExportCsv').addEventListener('click', exportCsv);
}
function stepAgendaFecha(delta) {
  const i = STATE.fechas.indexOf(STATE.agendaFecha);
  const ni = Math.min(Math.max(i+delta,0), STATE.fechas.length-1);
  STATE.agendaFecha = STATE.fechas[ni];
  renderAgenda();
}

/* Buscador de tema: a diferencia del resto de la vista (acotada a un día), esto
   busca en TODAS las fechas — para responder "¿cuándo se da este tema y quién
   participa?" sin tener que ir día por día. */
function renderTemaSearchResults(query) {
  const q = query.trim().toUpperCase();
  const panel = document.getElementById('temaSearchResults');
  const mainView = document.getElementById('agendaMainView');
  if (!q) { panel.hidden = true; mainView.hidden = false; return; }
  mainView.hidden = true;
  panel.hidden = false;

  const matches = STATE.sessions
    .filter(s => (s.tema||'').toUpperCase().includes(q))
    .sort((a,b) => (a.fecha||'9999').localeCompare(b.fecha||'9999') || (a.hora||'').localeCompare(b.hora||''));

  if (!matches.length) {
    panel.innerHTML = `<div class="empty-state">Ningún tema coincide con "${esc(query)}".</div>`;
    return;
  }
  panel.innerHTML = `<div class="section-label">${matches.length} sesión(es) encontradas para "${esc(query)}"</div>
    <div class="tema-cards">${matches.map(s => {
      const modal = computeModalidad(s.attendees);
      const conflict = STATE.conflictsBySession.has(s.sessionId);
      return `<div class="tema-card ${conflict?'has-conflict':''}" data-fecha="${s.fecha}" title="Ir a esta fecha en la agenda">
        <div class="tc-tema">${esc(s.tema)}</div>
        <div class="tc-row"><span class="tc-fecha">${fmtFechaLarga(s.fecha)}</span><span class="mono">${s.hora||'—'}–${s.horaFin||'—'}</span></div>
        <div class="tc-row"><span class="tag">${esc(s.modulo||'—')}</span><span>${esc(s.capacitador||'Sin capacitador')}</span></div>
        <div class="tc-row"><span>${esc(s.localidad||'—')} · ${esc(s.lugar||'—')}</span><span>${esc(modal)}</span></div>
        <div class="tc-row"><span class="mono">${s.attendees.length} persona(s)</span>${conflict?'<span class="chip-conflict">⚠ con cruces</span>':'<span class="mono" style="color:var(--green)">OK</span>'}</div>
      </div>`;
    }).join('')}</div>`;
  panel.querySelectorAll('.tema-card').forEach(card => {
    card.addEventListener('click', () => {
      STATE.agendaFecha = card.dataset.fecha;
      document.getElementById('temaSearch').value = '';
      renderAgenda();
    });
  });
}

function renderAgenda() {
  renderKpis();
  const sel = document.getElementById('agendaFecha');
  sel.innerHTML = STATE.fechas.map(f => `<option value="${f}" ${f===STATE.agendaFecha?'selected':''}>${fmtFechaLarga(f)}</option>`).join('');
  sel.onchange = () => { STATE.agendaFecha = sel.value; renderAgenda(); };

  const fecha = STATE.agendaFecha;
  const sessionsToday = STATE.sessions.filter(s => s.fecha === fecha);
  const conflictsToday = STATE.conflicts.filter(c => c.fecha === fecha);

  // El filtro de Módulo/Localidad/Estado solo ofrece los valores que existen ESE día
  // (no la lista completa), para que sea rápido de usar como "vista de un día puntual".
  const modulosHoy = uniqueSorted(sessionsToday.map(s=>s.modulo));
  const moduloSel = document.getElementById('fModuloAgenda');
  if (!modulosHoy.includes(STATE.agendaModulo)) STATE.agendaModulo = '';
  moduloSel.innerHTML = `<option value="">Módulo: todos</option>` + modulosHoy.map(m=>`<option value="${esc(m)}" ${m===STATE.agendaModulo?'selected':''}>${esc(m)}</option>`).join('');

  const localidadesHoy = uniqueSorted(sessionsToday.map(s=>s.localidad));
  const localidadSel = document.getElementById('fLocalidadAgenda');
  if (!localidadesHoy.includes(STATE.agendaLocalidad)) STATE.agendaLocalidad = '';
  localidadSel.innerHTML = `<option value="">Localidad: todas</option>` + localidadesHoy.map(m=>`<option value="${esc(m)}" ${m===STATE.agendaLocalidad?'selected':''}>${esc(m)}</option>`).join('');

  const estadosHoy = uniqueSorted(sessionsToday.map(s=>s.estado));
  const estadoSel = document.getElementById('fEstadoAgenda');
  if (!estadosHoy.includes(STATE.agendaEstado)) STATE.agendaEstado = '';
  estadoSel.innerHTML = `<option value="">Estado: todos</option>` + estadosHoy.map(m=>`<option value="${esc(m)}" ${m===STATE.agendaEstado?'selected':''}>${esc(m)}</option>`).join('');

  const grupos = uniqueSorted(sessionsToday.map(s=>s.capacitador));
  const personas = new Set(); sessionsToday.forEach(s=>s.attendees.forEach(a=>personas.add(a.codigo)));
  const tramosCruzados = new Set();
  conflictsToday.forEach(c => c.sessionIds.forEach(id => tramosCruzados.add(id)));

  document.getElementById('agendaStats').innerHTML = `
    <div class="astat"><div class="n">${grupos.length}</div><div class="l">Grupos</div></div>
    <div class="astat"><div class="n">${sessionsToday.length}</div><div class="l">Tramos</div></div>
    <div class="astat"><div class="n">${personas.size}</div><div class="l">Personas</div></div>
    <div class="astat"><div class="n">${grupos.length}</div><div class="l">Capacitadores</div></div>
    <div class="astat ${tramosCruzados.size?'crit':''}"><div class="n">${tramosCruzados.size}</div><div class="l">Tramos cruzados</div></div>
  `;

  const alertsList = document.getElementById('agendaAlertsList');
  if (!conflictsToday.length) {
    alertsList.innerHTML = '<div class="alerts-empty">Sin conflictos detectados para esta fecha. ✓</div>';
  } else {
    alertsList.innerHTML = conflictsToday.map(alertChipHtml).join('');
    alertsList.querySelectorAll('.alert-chip').forEach(el => {
      el.addEventListener('click', () => jumpToSession(el.dataset.jump));
    });
  }

  const thead = document.getElementById('agendaThead');
  const tbody = document.getElementById('agendaTbody');
  const empty = document.getElementById('agendaEmpty');
  thead.innerHTML = `<tr>
    <th>Grp.</th><th>Horario</th><th>Mód.</th><th>Capacitador · Tema · Asistente</th>
    <th>Pers.</th><th>Localidad</th><th>Modalidad</th><th>Lugar</th><th class="th-sala">Sala específica</th><th>Alertas</th>
  </tr>`;
  empty.hidden = sessionsToday.length>0;

  if (!sessionsToday.length) {
    tbody.innerHTML = '';
  } else {
    const onlyConflicts = STATE.agendaOnlyConflicts;
    const moduloFiltro = STATE.agendaModulo;
    const localidadFiltro = STATE.agendaLocalidad;
    const estadoFiltro = STATE.agendaEstado;
    let groupsOrdered = grupos.map(cap => {
      const sessAll = sessionsToday.filter(s=>s.capacitador===cap).sort((a,b)=>(a.hora||'').localeCompare(b.hora||''));
      const sessShown = sessAll.filter(s =>
        (!onlyConflicts || STATE.conflictsBySession.has(s.sessionId)) &&
        (!moduloFiltro || s.modulo === moduloFiltro) &&
        (!localidadFiltro || s.localidad === localidadFiltro) &&
        (!estadoFiltro || s.estado === estadoFiltro)
      );
      const refForTime = sessShown.length ? sessShown : sessAll;
      return { cap, sessAll, sessShown, minH: Math.min(...refForTime.map(s=>s.horaMin??9999)) };
    });
    groupsOrdered = groupsOrdered.filter(g => g.sessShown.length > 0);
    groupsOrdered.sort((a,b)=>a.minH-b.minH);

    if (!groupsOrdered.length) {
      tbody.innerHTML = `<tr><td colspan="10" class="empty-state">Sin sesiones que coincidan con estos filtros para esta fecha.</td></tr>`;
    } else {
    let html = '';
    let grpNum = 0;
    for (const { cap, sessAll, sessShown } of groupsOrdered) {
      grpNum++;
      const maxH = Math.max(...sessAll.map(s=>s.horaFinMin??0));
      const nPers = new Set(); sessAll.forEach(s=>s.attendees.forEach(a=>nPers.add(a.codigo)));
      const allAttendeesGrupo = sessAll.flatMap(s=>s.attendees);
      const loc = sessAll[0].localidad, lugar = sessAll[0].lugar;
      const modal = computeModalidad(allAttendeesGrupo);
      const mods = uniqueSorted(sessAll.map(s=>s.modulo)).join('/');
      const groupConflict = sessAll.some(s=>STATE.conflictsBySession.has(s.sessionId));

      html += `<tr class="arow-grupo ${groupConflict?'has-conflict':''}">
        <td class="mono">${grpNum}</td>
        <td class="mono">${minToTime(Math.min(...sessAll.map(s=>s.horaMin??9999)))} - ${minToTime(maxH)}</td>
        <td>${esc(mods)}</td>
        <td class="acap-cell">${esc(cap||'Sin capacitador asignado')}</td>
        <td class="mono">${nPers.size}</td>
        <td>${esc(loc||'—')}</td>
        <td class="amodal-cell">${esc(modal||'—')}</td>
        <td>${esc(lugar||'—')}</td>
        <td></td>
        <td>${groupConflict ? '<span class="chip-conflict">⚠ con cruces</span>' : ''}</td>
      </tr>`;

      for (const s of sessShown) {
        const tramoNum = sessAll.indexOf(s) + 1;
        const cs = STATE.conflictsBySession.get(s.sessionId) || [];
        const tramoModal = computeModalidad(s.attendees);
        html += `<tr class="arow-tramo ${cs.length?'has-conflict':''}" data-sid="${esc(s.sessionId)}">
          <td></td>
          <td class="mono">${s.hora} - ${s.horaFin}</td>
          <td>${esc(s.modulo||'—')}</td>
          <td class="atema-cell" title="Doble clic para ${canEdit()?'editar':'ver'} esta sesión">${tramoNum}) ${esc(s.tema)}${cs.map(c=>`<div class="tramo-warn" title="${esc(c.detail)}">⚠ ${esc(shortConflictText(c, s.sessionId))}</div>`).join('')}</td>
          <td class="mono">${s.attendees.length}</td>
          <td>${esc(s.localidad||'—')}</td>
          <td>${esc(tramoModal)}</td>
          <td>${esc(s.lugar||'—')}</td>
          <td><select class="cell-input cell-sala sala-quick" data-sid="${esc(s.sessionId)}" ${canEdit()?'':'disabled'}>${salaOptionsHtml(s.sala, s.localidad)}</select></td>
          <td>${cs.length ? conflictBadgeFromList(cs) : '<span class="mono" style="color:var(--green)">OK</span>'}</td>
        </tr>`;

        for (const att of s.attendees) {
          const attRow = STATE.registro.find(r => r.id === att.id);
          const attConflict = attRow ? getRowConflicts(attRow).length > 0 : false;
          const dis = canEdit() ? '' : 'disabled';
          html += `<tr class="arow-persona ${attConflict?'has-conflict':''}" data-id="${att.id}">
            <td></td><td></td><td></td>
            <td class="apersona-cell"><div class="persona-name-wrap">• <input class="cell-input" data-field="nombre" data-id="${att.id}" list="dl-nombre-g" value="${esc(att.nombre)}" ${dis}></div></td>
            <td></td>
            <td><input class="cell-input" data-field="localidad" data-id="${att.id}" list="dl-loc-g" value="${esc(att.localidad)}" ${dis}></td>
            <td><select class="cell-input" data-field="modalidad" data-id="${att.id}" ${dis}>${['PRESENCIAL','VIRTUAL','POR CONFIRMAR'].map(v=>`<option value="${v}" ${v===att.modalidad?'selected':''}>${v}</option>`).join('')}</select></td>
            <td></td><td></td>
            <td class="row-actions">${canEdit() ? `<button class="icon-btn" title="Quitar de esta sesión" data-del="${att.id}">✕</button>` : ''}</td>
          </tr>`;
        }
      }
    }
    tbody.innerHTML = html;

    wireEditableRows(tbody);
    tbody.querySelectorAll('.sala-quick').forEach(sel => {
      sel.addEventListener('change', async () => {
        sel.disabled = true;
        await updateSessionSala(sel.dataset.sid, sel.value);
        sel.disabled = false;
        if (STATE.lastSaveError) toast('No se pudo guardar la sala — revisa la conexión');
        else toast('Sala guardada y confirmada en Supabase');
      });
    });
    tbody.querySelectorAll('.arow-tramo').forEach(el => {
      el.addEventListener('dblclick', () => openSessionModal(el.dataset.sid));
    });
    }
  }

  const activeSearch = document.getElementById('temaSearch').value;
  if (activeSearch.trim()) renderTemaSearchResults(activeSearch);
}

async function updateSessionSala(sessionId, sala) {
  for (const r of STATE.registro) {
    if (computeRowSessionId(r) === sessionId) { r.sala = sala; markDirty(r.id); }
  }
  recompute();
  await persist(false);
  refreshActiveView();
}

function alertChipHtml(c) {
  let text;
  switch (c.type) {
    case 'persona_choque': text = `${c.nombre}: 2 capacitaciones a la vez`; break;
    case 'capacitador_2_lugares': text = `${c.capacitador}: en 2 lugares a la vez`; break;
    case 'capacitador_solape': text = `${c.capacitador}: solape de horario`; break;
    case 'sala_doble': text = `${c.sala}: doble reserva`; break;
    case 'capacidad': text = `${c.sala}: capacidad insuficiente`; break;
    default: text = c.label;
  }
  return `<button type="button" class="alert-chip ${c.severity}" data-jump="${esc(c.sessionIds[0])}" title="${esc(c.detail)}">
    <span class="ac-text">${esc(text)}</span>
  </button>`;
}

function jumpToSession(sessionId) {
  const el = document.querySelector(`#agendaTbody tr.arow-tramo[data-sid="${cssEscape(sessionId)}"]`);
  if (!el) return;
  el.scrollIntoView({ behavior:'smooth', block:'center' });
  el.style.transition = 'none';
  el.style.background = 'rgba(227,6,19,0.28)';
  requestAnimationFrame(() => {
    el.style.transition = 'background 1.2s ease';
    el.style.background = '';
  });
}
function cssEscape(s) { return s.replace(/["\\]/g, '\\$&'); }

function conflictBadgeFromList(cs) {
  if (!cs.length) return '<span class="mono" style="color:var(--green)">OK</span>';
  const crit = cs.some(c=>c.severity==='critico');
  const title = cs.map(c=>c.label+': '+c.detail).join('\n');
  return `<span class="chip-conflict" title="${esc(title)}" style="${crit?'':'background:rgba(242,169,59,0.14);color:var(--amber-ink);border-color:rgba(242,169,59,0.35)'}">⚠ ${cs.length}</span>`;
}

/* ============================================================
   TAB: GANTT
   ============================================================ */
function initGanttTab() {
  document.querySelectorAll('.gt-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.gt-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      STATE.gview = btn.dataset.gview;
      document.getElementById('ganttDiaControls').style.display = STATE.gview==='dia' ? 'flex' : 'none';
      document.getElementById('ganttDia').hidden = STATE.gview!=='dia';
      document.getElementById('ganttMes').hidden = STATE.gview!=='mes';
      renderGantt();
    });
  });
  document.querySelectorAll('.gl-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.gl-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      STATE.ganttLane = btn.dataset.glane;
      renderGanttDia();
    });
  });
  document.getElementById('fLocalidadGantt').addEventListener('change', (e) => {
    STATE.ganttLocalidad = e.target.value;
    renderGantt();
  });
  document.getElementById('fTemaGantt').addEventListener('input', (e) => {
    STATE.ganttTema = e.target.value;
    renderGantt();
  });
}

function renderGantt() {
  const sel = document.getElementById('ganttFecha');
  sel.innerHTML = STATE.fechas.map(f => `<option value="${f}" ${f===STATE.ganttFecha?'selected':''}>${fmtFechaLarga(f)}</option>`).join('');
  sel.onchange = () => { STATE.ganttFecha = sel.value; renderGanttDia(); };

  const mods = uniqueSorted(STATE.sessions.map(s=>s.modulo));
  document.getElementById('ganttLegend').innerHTML = mods.map(m => `
    <span class="legend-swatch"><i style="background:${moduloColor(m)}"></i>${esc(m)}</span>
  `).join('') + `<span class="legend-swatch"><i style="background:transparent;border:2px solid var(--red)"></i>Conflicto</span>`;

  // Localidad y Tema son compartidos entre Vista día y Vista mes — se listan a partir
  // de TODAS las sesiones (no solo las del día elegido en Vista día), para que sirvan
  // igual de bien en las dos vistas sin tener que cambiar de fecha primero.
  const todasLocalidades = uniqueSorted(STATE.sessions.map(s=>s.localidad));
  const localidadSel = document.getElementById('fLocalidadGantt');
  if (!todasLocalidades.includes(STATE.ganttLocalidad)) STATE.ganttLocalidad = '';
  localidadSel.innerHTML = `<option value="">Localidad: todas</option>` + todasLocalidades.map(m=>`<option value="${esc(m)}" ${m===STATE.ganttLocalidad?'selected':''}>${esc(m)}</option>`).join('');
  document.getElementById('dl-tema-gantt').innerHTML = uniqueSorted(STATE.sessions.map(s=>s.tema)).map(t=>`<option value="${esc(t)}">`).join('');

  if (STATE.gview === 'dia') renderGanttDia(); else renderGanttMes();
}

function ganttSessionMatchesFilters(s) {
  const temaQuery = (STATE.ganttTema || '').trim().toUpperCase();
  if (STATE.ganttLocalidad && s.localidad !== STATE.ganttLocalidad) return false;
  if (temaQuery && !(s.tema||'').toUpperCase().includes(temaQuery)) return false;
  return true;
}

function renderGanttDia() {
  const fecha = STATE.ganttFecha;
  const allSessionsToday = STATE.sessions.filter(s => s.fecha === fecha);

  const sessions = allSessionsToday.filter(ganttSessionMatchesFilters);
  const container = document.getElementById('ganttDia');
  if (!allSessionsToday.length) { container.innerHTML = '<div class="gantt-empty-lanes">No hay sesiones para esta fecha.</div>'; return; }
  if (!sessions.length) { container.innerHTML = '<div class="gantt-empty-lanes">Ninguna sesión coincide con estos filtros en esta fecha.</div>'; return; }

  let minM = Math.min(...sessions.map(s=>s.horaMin ?? 420));
  let maxM = Math.max(...sessions.map(s=>s.horaFinMin ?? 1080));
  minM = Math.floor(minM/60)*60; maxM = Math.ceil(maxM/60)*60;
  if (maxM - minM < 120) maxM = minM + 120;
  const totalMin = maxM - minM;

  let lanes;
  if (STATE.ganttLane === 'sala') {
    lanes = uniqueSorted(sessions.map(s=>s.sala || 'Sin sala asignada'));
  } else {
    lanes = uniqueSorted(sessions.map(s=>s.capacitador || 'Sin capacitador'));
  }

  const hourMarks = [];
  for (let m=minM; m<=maxM; m+=60) hourMarks.push(m);

  let html = `<div class="gantt-grid">`;
  html += `<div class="gantt-hours" style="grid-template-columns:180px repeat(${hourMarks.length-1},1fr);">`;
  html += `<div></div>`;
  for (let i=0;i<hourMarks.length-1;i++) html += `<div class="gantt-hour-label">${minToTime(hourMarks[i])}</div>`;
  html += `</div>`;

  for (const lane of lanes) {
    const laneSessions = sessions.filter(s => (STATE.ganttLane==='sala' ? (s.sala||'Sin sala asignada') : (s.capacitador||'Sin capacitador')) === lane);
    html += `<div class="gantt-lane-row" style="grid-template-columns:180px 1fr;">`;
    html += `<div class="gantt-lane-label">${esc(lane)}</div>`;
    html += `<div class="gantt-track">`;
    for (let i=1;i<hourMarks.length-1;i++) {
      const pct = ((hourMarks[i]-minM)/totalMin)*100;
      html += `<div class="gantt-vline" style="left:${pct}%"></div>`;
    }
    for (const s of laneSessions) {
      const left = ((s.horaMin-minM)/totalMin)*100;
      const width = Math.max((( (s.horaFinMin - s.horaMin) /totalMin)*100), 1.5);
      const conflict = STATE.conflictsBySession.has(s.sessionId);
      html += `<div class="gantt-bar ${conflict?'conflict':''}" data-sid="${esc(s.sessionId)}" style="left:${left}%;width:${width}%;background:${moduloColor(s.modulo)}" title="${esc(s.tema)} · ${esc(s.modulo)} · ${esc(s.capacitador)} · ${s.hora}-${s.horaFin} · ${s.attendees.length} pers.">
        <div class="gantt-bar-tema">${esc(s.tema)}</div>
        <div class="gantt-bar-cap">${esc(s.modulo||'—')} · ${esc(s.capacitador||'—')}</div>
      </div>`;
    }
    html += `</div></div>`;
  }
  html += `</div>`;
  container.innerHTML = html;
  container.querySelectorAll('.gantt-bar').forEach(el => el.addEventListener('click', () => openSessionModal(el.dataset.sid)));
}

function renderGanttMes() {
  const container = document.getElementById('ganttMes');
  const filtroActivo = !!(STATE.ganttLocalidad || (STATE.ganttTema||'').trim());
  let rows = STATE.fechas.map(f => {
    const sessAll = STATE.sessions.filter(s=>s.fecha===f);
    const sess = sessAll.filter(ganttSessionMatchesFilters);
    const sessIds = new Set(sess.map(s=>s.sessionId));
    const conf = STATE.conflicts.filter(c=>c.fecha===f && c.sessionIds.some(id=>sessIds.has(id)));
    const crit = conf.filter(c=>c.severity==='critico').length;
    const other = conf.length - crit;
    // Desglose por módulo (antes era una sola barra ciega que juntaba todo el día)
    const porModulo = new Map();
    sess.forEach(s => { const k = s.modulo || '—'; porModulo.set(k, (porModulo.get(k)||0)+1); });
    return { fecha:f, total: sess.length, crit, other, porModulo };
  });
  if (filtroActivo) rows = rows.filter(r => r.total > 0);

  if (!rows.length) {
    container.innerHTML = '<div class="gantt-empty-lanes">Ninguna fecha tiene sesiones que coincidan con estos filtros.</div>';
    return;
  }
  const maxTotal = Math.max(...rows.map(r=>r.total), 1);
  container.innerHTML = rows.map(r => {
    const segs = Array.from(r.porModulo.entries()).map(([mod, count]) => {
      const pct = (count/maxTotal)*100;
      return `<div class="gm-seg" style="width:${pct}%;background:${moduloColor(mod)}" title="${esc(mod)}: ${count} sesión(es)"></div>`;
    }).join('');
    return `<div class="gm-row" data-fecha="${r.fecha}">
      <div class="gm-date">${fmtFechaLarga(r.fecha)}</div>
      <div class="gm-bar-wrap">${segs}</div>
      <div class="gm-counts">${r.total} sesiones ${ (r.crit+r.other) ? `· <b>${r.crit+r.other} alertas</b>` : ''}</div>
    </div>`;
  }).join('');
  container.querySelectorAll('.gm-row').forEach(el => {
    el.addEventListener('click', () => {
      STATE.ganttFecha = el.dataset.fecha;
      document.querySelector('.gt-btn[data-gview="dia"]').click();
    });
  });
}

/* ---------------- sincronización en tiempo real (bidireccional) ---------------- */
let realtimeRefreshTimer = null;
function scheduleRealtimeRefresh() {
  clearTimeout(realtimeRefreshTimer);
  realtimeRefreshTimer = setTimeout(() => {
    const active = document.activeElement;
    const isEditing = active && (active.tagName === 'INPUT' || active.tagName === 'SELECT');
    if (isEditing) { scheduleRealtimeRefresh(); return; } // el usuario está escribiendo: reintenta en un momento
    recompute();
    refreshActiveView();
  }, 400);
}

function handleRealtimeChange(payload) {
  const { eventType, new: newRow, old: oldRow } = payload;
  if (eventType === 'INSERT' || eventType === 'UPDATE') {
    if (!newRow) return;
    const row = fromDbRow(newRow);
    const idx = STATE.registro.findIndex(r => r.id === row.id);
    if (idx === -1) STATE.registro.push(row); else STATE.registro[idx] = row;
  } else if (eventType === 'DELETE') {
    const id = oldRow && oldRow.id;
    if (id == null) return;
    STATE.registro = STATE.registro.filter(r => r.id !== id);
  }
  scheduleRealtimeRefresh();
}

function subscribeRealtime() {
  if (!supabaseClient) return;
  try {
    supabaseClient
      .channel('registro-changes')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'registro' }, handleRealtimeChange)
      .subscribe();
  } catch (e) {
    console.error('No se pudo suscribir a cambios en tiempo real:', describeSupabaseError(e), e);
  }
}

/* ============================================================
   ACCESO POR CÓDIGO (Editor / Solo lectura)
   Los códigos viven en Supabase (tabla app_meta), no en este archivo — se pueden
   cambiar en cualquier momento desde el SQL Editor sin tocar el HTML.
   Esto NO es seguridad real (cualquiera con el archivo puede leer el código
   fuente), es solo una barrera para evitar ediciones accidentales.
   ============================================================ */
let ACCESS_CODES = null;
let resolveGatePromise = null;

async function fetchOrSeedAccessCodes() {
  const defaults = { editor: 'EDITAR-ADELCA', viewer: 'VER-ADELCA' };
  if (!supabaseClient) return defaults;
  try {
    const { data, error } = await supabaseClient.from('app_meta').select('key,value').in('key', ['editor_code','viewer_code']);
    if (error) throw error;
    const found = {};
    (data || []).forEach(r => found[r.key] = r.value);
    const toSeed = [];
    if (!found.editor_code) toSeed.push({ key: 'editor_code', value: defaults.editor });
    if (!found.viewer_code) toSeed.push({ key: 'viewer_code', value: defaults.viewer });
    if (toSeed.length) {
      try { await supabaseClient.from('app_meta').upsert(toSeed, { onConflict: 'key' }); }
      catch (e) { console.error('No se pudieron sembrar los códigos de acceso por defecto:', describeSupabaseError(e)); }
    }
    return {
      editor: found.editor_code || defaults.editor,
      viewer: found.viewer_code || defaults.viewer,
    };
  } catch (e) {
    const msg = describeSupabaseError(e);
    console.error('No se pudieron leer los códigos de acceso, usando valores por defecto:', msg, e);
    toast('No se pudo leer app_meta en Supabase (' + msg + ') — usando códigos por defecto');
    return defaults;
  }
}

/* Los errores de Supabase/PostgREST son objetos ({message, code, details, hint}), no
   strings — mostrarlos directo con console.error(e) o en un toast concatenado da
   "[object Object]" en vez del motivo real. Esto saca SIEMPRE algo legible. */
function describeSupabaseError(e) {
  if (!e) return 'error desconocido';
  if (typeof e === 'string') return e;
  const base = e.message || e.hint || e.details || e.error_description || e.msg || JSON.stringify(e);
  // "DataCloneError ... Headers object could not be cloned" y errores de postMessage
  // casi siempre vienen de una extensión del navegador interceptando la conexión
  // (bloqueador de anuncios, antivirus con protección web, VPN, gestor de contraseñas),
  // no de un problema en la app. Se marca para poder diagnosticarlo rápido.
  if (/postmessage|dataclone|could not be cloned/i.test(base)) {
    return base + ' → esto casi siempre lo causa una extensión del navegador interceptando la conexión (bloqueador de anuncios, antivirus web, VPN, gestor de contraseñas). Probá en una ventana InPrivada/Incógnito para confirmarlo.';
  }
  return base;
}

function initAuthGate() {
  document.getElementById('authSubmit').addEventListener('click', submitAuthCode);
  document.getElementById('authCodeInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') submitAuthCode(); });
  document.getElementById('roleBadge').addEventListener('click', async () => {
    try { localStorage.removeItem('capacitaciones_role_v1'); } catch (e) {}
    openAuthGate();
    await new Promise(resolve => { resolveGatePromise = resolve; });
    updateRoleBadge();
    applyRolePermissions();
    refreshActiveView();
  });
}

function openAuthGate() {
  const gate = document.getElementById('authGate');
  document.getElementById('authCodeInput').value = '';
  document.getElementById('authError').hidden = true;
  gate.hidden = false;
  document.getElementById('authCodeInput').focus();
}

function submitAuthCode() {
  const val = document.getElementById('authCodeInput').value.trim();
  let role = null;
  if (ACCESS_CODES) {
    if (val && val === ACCESS_CODES.editor) role = 'editor';
    else if (val && val === ACCESS_CODES.viewer) role = 'viewer';
  }
  if (!role) {
    document.getElementById('authError').hidden = false;
    const input = document.getElementById('authCodeInput');
    input.value = ''; input.focus();
    return;
  }
  STATE.role = role;
  try { localStorage.setItem('capacitaciones_role_v1', role); } catch (e) {}
  document.getElementById('authGate').hidden = true;
  if (resolveGatePromise) { const r = resolveGatePromise; resolveGatePromise = null; r(); }
}

async function resolveRole() {
  if (!supabaseClient) { STATE.role = 'editor'; return; }
  let remembered = null;
  try { remembered = localStorage.getItem('capacitaciones_role_v1'); } catch (e) {}
  ACCESS_CODES = await fetchOrSeedAccessCodes();
  if (remembered === 'editor' || remembered === 'viewer') { STATE.role = remembered; return; }
  openAuthGate();
  await new Promise(resolve => { resolveGatePromise = resolve; });
}

function updateRoleBadge() {
  const el = document.getElementById('roleBadge');
  if (!el) return;
  if (!supabaseClient) { el.hidden = true; return; }
  el.hidden = false;
  el.textContent = STATE.role === 'editor' ? '✎ Editor' : '👁 Solo lectura';
  el.className = 'role-badge ' + (STATE.role === 'editor' ? 'role-editor' : 'role-viewer');
}

function applyRolePermissions() {
  const nuevaSesionBtn = document.getElementById('btnNuevaSesion');
  if (nuevaSesionBtn) nuevaSesionBtn.hidden = !canEdit();
}

/* ============================================================
   BOOT
   ============================================================ */
async function boot() {
  initTabs(); initModal(); initAgendaTab(); initGanttTab(); initAuthGate(); initRefreshButton();
  await resolveRole();
  updateRoleBadge();
  applyRolePermissions();
  await loadState();
  recompute();
  renderAgenda();
  if (STATE.syncMode === 'supabase') subscribeRealtime();
}
boot();

</script>
