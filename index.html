<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Centro de Control · ADELCA · Capacitaciones SAP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<!--
  Tipografía corporativa ADELCA: Nexa (Fontfabric).
  Nexa es una fuente comercial con licencia — no está disponible en Google Fonts ni en
  ningún CDN público, así que no se puede referenciar por URL como las de arriba.
  Si cuentan con los archivos .woff2/.woff bajo la licencia de ADELCA, súbanlos junto a
  este archivo y descomenten/completen el bloque @font-face de abajo con sus rutas reales.
  Mientras tanto, el sitio usa 'Nexa' como familia declarada y cae automáticamente a
  Space Grotesk / Inter (ya cargadas arriba) si Nexa no está instalada ni servida.
-->
<style>
/*
@font-face { font-family: 'Nexa'; src: url('./fonts/Nexa-Regular.woff2') format('woff2'); font-weight: 400; font-display: swap; }
@font-face { font-family: 'Nexa'; src: url('./fonts/Nexa-Bold.woff2') format('woff2'); font-weight: 700; font-display: swap; }
*/
</style>
<style>
:root {
  --bg: #F2F4F6;
  --panel: #FFFFFF;
  --panel-2: #F1F3F5;
  --line: #E1E5EA;
  --line-soft: #EAEDF0;
  --text: #1A2027;
  --text-muted: #5B6572;
  --text-dim: #8B95A1;
  --amber: #F2A93B;
  --amber-ink: #B45309;
  --amber-dim: #8A6A2E;
  --red: #E30613;   /* ADELCA brand red · Pantone 485 C */
  --red-bg: rgba(227,6,19,0.08);
  --green: #3FB27F;
  --green-ink: #1E7A54;
  --blue: #2F6FE0;
  --violet: #A78BFA;
  --radius: 8px;
  --font-display: 'Nexa', 'Space Grotesk', 'Inter', sans-serif; /* Nexa = tipografía corporativa ADELCA */
  --font-body: 'Nexa', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 13.5px;
  line-height: 1.45;
}
#app { min-height: 100vh; display: flex; flex-direction: column; }

::selection { background: var(--red); color: #FFFFFF; }

button { font-family: inherit; cursor: pointer; }
select, input { font-family: inherit; }

/* ---------- Topbar ---------- */
.topbar {
  display: flex;
  align-items: center;
  gap: 24px;
  padding: 10px 20px;
  background: linear-gradient(180deg, #FFFFFF, #F7F8FA);
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  z-index: 40;
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark { display: flex; }
.brand-title {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 15px;
  letter-spacing: 0.2px;
  color: var(--text);
}
.brand-sub { font-size: 11px; color: var(--text-muted); margin-top: 1px; }

.tabs { display: flex; gap: 4px; margin-left: 12px; }
.tab-btn {
  background: transparent;
  border: 1px solid transparent;
  color: var(--text-muted);
  padding: 7px 14px;
  border-radius: 7px;
  font-size: 13px;
  font-weight: 500;
  transition: all 0.15s ease;
}
.tab-btn:hover { color: var(--text); background: var(--line-soft); }
.tab-btn.active { color: #FFFFFF; background: var(--red); font-weight: 600; }

.topbar-status { margin-left: auto; display: flex; align-items: center; gap: 14px; }
.alerts-pill {
  display: flex; align-items: center; gap: 7px;
  background: var(--red-bg);
  border: 1px solid rgba(227,6,19,0.35);
  color: var(--red);
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 12.5px;
  font-weight: 600;
}
.alerts-pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--red); box-shadow: 0 0 0 3px rgba(227,6,19,0.2); }
.alerts-pill:hover { border-color: rgba(227,6,19,0.6); }
.save-state { font-size: 11.5px; color: var(--text-dim); font-family: var(--font-mono); }
.save-state.saving { color: var(--amber-ink); }
.save-state.sync-error { color: var(--red); font-weight: 600; }

.role-badge {
  font-size: 11px; font-weight: 600; padding: 5px 11px; border-radius: 14px; cursor: pointer;
  border: 1px solid var(--line); background: var(--panel-2); color: var(--text-muted);
}
.role-badge.role-editor { background: rgba(63,178,127,0.14); border-color: rgba(63,178,127,0.4); color: var(--green-ink); }
.role-badge.role-viewer { background: rgba(242,169,59,0.14); border-color: rgba(242,169,59,0.4); color: var(--amber-ink); }
.role-badge:hover { filter: brightness(0.96); }

.btn-refresh {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11.5px; font-weight: 600; padding: 5px 11px; border-radius: 14px;
  border: 1px solid var(--line); background: var(--panel); color: var(--text-muted);
}
.btn-refresh:hover { color: var(--text); border-color: var(--text-dim); }
.btn-refresh:disabled { opacity: 0.6; cursor: default; }
.btn-refresh .refresh-icon { display: inline-block; font-size: 13px; line-height: 1; }
.btn-refresh.spinning .refresh-icon { animation: spin-refresh 0.8s linear infinite; }
@keyframes spin-refresh { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

/* ---------- Puerta de acceso (login por código) ---------- */
.auth-gate {
  position: fixed; inset: 0; z-index: 300; background: var(--bg);
  display: flex; align-items: center; justify-content: center;
}
.auth-gate[hidden] { display: none; }
.auth-card {
  width: 100%; max-width: 340px; padding: 34px 30px; text-align: center;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  box-shadow: 0 20px 50px rgba(20,30,45,0.12);
}
.auth-mark { display: flex; justify-content: center; margin-bottom: 14px; }
.auth-title { font-family: var(--font-display); font-weight: 600; font-size: 16px; margin-bottom: 4px; }
.auth-sub { font-size: 12.5px; color: var(--text-muted); margin-bottom: 20px; }
.auth-input { width: 100%; text-align: center; font-size: 15px; letter-spacing: 0.04em; margin-bottom: 10px; }
.auth-error { color: var(--red); font-size: 12px; margin-bottom: 10px; }
.auth-submit { width: 100%; }

/* ---------- Layout ---------- */
main { flex: 1; padding: 18px 20px 40px; max-width: 1500px; width: 100%; margin: 0 auto; }
.tab-panel { display: none; }
.tab-panel.active { display: block; animation: fadein .18s ease; }
@keyframes fadein { from { opacity: 0; transform: translateY(2px);} to { opacity:1; transform: none; } }

.section-label {
  font-family: var(--font-display);
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-muted);
  margin-bottom: 10px;
}

/* ---------- Controls ---------- */
.input {
  background: var(--panel-2);
  border: 1px solid var(--line);
  color: var(--text);
  border-radius: 6px;
  padding: 7px 10px;
  font-size: 13px;
  outline: none;
}
.input:focus { border-color: var(--red); }
.search-input { width: 320px; }
.select-input { min-width: 130px; }
select.input {
  appearance: none; -webkit-appearance: none; -moz-appearance: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0 L5 6 L10 0 Z' fill='%235B6572'/></svg>");
  background-repeat: no-repeat;
  background-position: right 10px center;
  padding-right: 26px;
}
select.input option { background: var(--panel); color: var(--text); }

.btn {
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--text);
  padding: 7px 14px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 500;
  transition: all .12s ease;
}
.btn:hover { border-color: var(--text-dim); }
.btn-amber { background: var(--red); border-color: var(--red); color: #FFFFFF; font-weight: 600; }
.btn-amber:hover { background: #C60510; border-color: #C60510; }
.btn-ghost { background: transparent; }
.btn-danger { background: transparent; border-color: var(--red); color: var(--red); }
.btn-danger:hover { background: var(--red-bg); }
.btn-sm { padding: 5px 9px; font-size: 12px; }
.btn-incidencias { border-color: rgba(227,6,19,0.35); color: var(--red); }
.btn-incidencias:hover { background: var(--red-bg); }
.btn-incidencias.active { background: var(--red); border-color: var(--red); color: #FFFFFF; font-weight: 600; }

.view-toggle { display: inline-flex; background: var(--panel-2); border: 1px solid var(--line); border-radius: 7px; padding: 2px; }
.vt-btn, .gt-btn, .gl-btn {
  background: transparent; border: none; color: var(--text-muted);
  padding: 6px 12px; border-radius: 5px; font-size: 12.5px; font-weight: 500;
}
.vt-btn.active, .gt-btn.active, .gl-btn.active { background: #FFFFFF; color: var(--text); box-shadow: 0 1px 2px rgba(20,30,45,0.08); }

/* ---------- Registro toolbar ---------- */
.panel-toolbar {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; flex-wrap: wrap; margin-bottom: 14px;
}
.tb-group { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.tb-actions { margin-left: auto; }

.kpi-row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin-bottom: 16px; }
.kpi-card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 12px 14px;
  box-shadow: 0 1px 2px rgba(20,30,45,0.04);
}
.kpi-card .kpi-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
.kpi-card .kpi-value { font-family: var(--font-display); font-size: 22px; font-weight: 600; margin-top: 4px; }
.kpi-card.warn .kpi-value { color: var(--amber-ink); }
.kpi-card.crit .kpi-value { color: var(--red); }

/* ---------- Table ---------- */
.table-wrap {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow-x: auto;
}
.data-table { width: 100%; border-collapse: collapse; font-size: 12.8px; }
.data-table thead th {
  background: var(--panel-2);
  text-align: left;
  padding: 9px 10px;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-muted);
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
  z-index: 2;
}
.data-table tbody td {
  padding: 2px 4px;
  border-bottom: 1px solid var(--line-soft);
  vertical-align: middle;
}
.data-table tbody tr:hover { background: rgba(20,30,45,0.03); }
.data-table tbody tr.has-conflict { box-shadow: inset 3px 0 0 var(--red); }
.mono { font-family: var(--font-mono); color: var(--text-muted); }

/* Celdas editables estilo hoja de cálculo: como el Excel, cada celda es directamente escribible */
.cell-input {
  width: 100%; min-width: 92px;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 4px;
  padding: 6px 7px;
  font-size: 12.5px;
  font-family: inherit;
  color: var(--text);
}
.cell-input:hover { background: var(--panel-2); }
.cell-input:disabled { opacity: 0.55; cursor: not-allowed; background: transparent; }
.cell-input:disabled:hover { background: transparent; }
.cell-input:focus {
  background: #FFFFFF; border-color: var(--red); outline: none;
  box-shadow: 0 0 0 2px rgba(227,6,19,0.12);
  position: relative; z-index: 1;
}
select.cell-input {
  appearance: none; -webkit-appearance: none; -moz-appearance: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='9' height='5'><path d='M0 0 L4.5 5 L9 0 Z' fill='%235B6572'/></svg>");
  background-repeat: no-repeat; background-position: right 6px center; padding-right: 18px;
  min-width: 122px;
}
.cell-sala { min-width: 190px; }
.cell-narrow { min-width: 64px; }
.cell-time { min-width: 76px; }
.cell-date { min-width: 118px; }
.cell-wide { min-width: 200px; }
.dur-cell { text-align: center; padding: 6px 7px; }
.data-table thead th:last-child, .data-table tbody td:last-child { padding-right: 8px; }

.reg-pager {
  display: flex; align-items: center; justify-content: flex-end; gap: 16px;
  padding: 10px 4px 2px; font-size: 12px; color: var(--text-muted);
}
.tag {
  display: inline-block; padding: 2px 7px; border-radius: 4px;
  font-size: 11px; font-weight: 600; letter-spacing: 0.02em;
  background: rgba(47,111,224,0.12); color: #1D4ED8;
}
.tag-estado-programada { background: rgba(63,178,127,0.14); color: var(--green-ink); }
.tag-estado-porconfirmar { background: rgba(242,169,59,0.16); color: var(--amber-ink); }
.chip-conflict {
  display: inline-flex; align-items: center; gap: 4px;
  background: var(--red-bg); color: var(--red); border: 1px solid rgba(227,6,19,0.3);
  padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; cursor: help;
}
.row-actions { display: flex; gap: 6px; }
.icon-btn {
  background: transparent; border: 1px solid var(--line); color: var(--text-muted);
  width: 26px; height: 26px; border-radius: 5px; font-size: 13px; display:inline-flex; align-items:center; justify-content:center;
}
.icon-btn:hover { color: var(--text); border-color: var(--text-dim); }

.empty-state { padding: 40px; text-align: center; color: var(--text-muted); }

/* ---------- Agenda Reunion ---------- */
.agenda-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 14px; flex-wrap: wrap; }
.agenda-datepick { display: flex; align-items: center; gap: 10px; }
.agenda-datepick label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
.agenda-nav { display: flex; gap: 4px; }
.agenda-stats { display: flex; gap: 22px; flex-wrap: wrap; }
.astat { text-align: right; }
.astat .n { font-family: var(--font-display); font-size: 20px; font-weight: 600; }
.astat .l { font-size: 10.5px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
.astat.crit .n { color: var(--red); }

/* Alertas del día: chips compactos de una línea, no cajas ni panel lateral */
.alerts-chips { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 14px; }
.alert-chip {
  display: inline-flex; align-items: center; gap: 5px; max-width: 320px;
  background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--amber);
  border-radius: 6px; padding: 5px 10px; font-size: 11.5px; font-family: inherit; cursor: pointer;
}
.alert-chip::before { content: '⚠'; font-size: 11px; }
.alert-chip .ac-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.alert-chip.critico { border-left-color: var(--red); }
.alert-chip.medio { border-left-color: var(--amber); }
.alert-chip.alto { border-left-color: #E07A1F; }
.alert-chip:hover { background: var(--panel-2); }
.alerts-empty { color: var(--text-muted); font-size: 12.5px; padding: 6px 2px; margin-bottom: 10px; }

/* Buscador de tema (cruza todas las fechas, no solo el día seleccionado) */
.tema-search-row { margin-bottom: 12px; }
.tema-search-input { width: 100%; max-width: 480px; }
.tema-search-results { margin-bottom: 16px; }
.tema-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; margin-top: 8px; }
.tema-card {
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px;
  cursor: pointer; display: flex; flex-direction: column; gap: 6px;
}
.tema-card:hover { border-color: var(--text-dim); box-shadow: 0 2px 8px rgba(20,30,45,0.06); }
.tema-card.has-conflict { border-left: 3px solid var(--red); }
.tc-tema { font-weight: 600; font-size: 12.8px; line-height: 1.3; }
.tc-row { display: flex; justify-content: space-between; align-items: center; font-size: 11.5px; color: var(--text-muted); gap: 8px; }
.tc-fecha { color: var(--text); font-weight: 500; text-transform: capitalize; }

/* Jerarquía Grupo → Tramo → Persona, fiel a la hoja AGENDA REUNION original */
.data-table thead th.th-sala { background: #BF8F00; color: #FFFFFF; }
.arow-grupo td {
  background: #1F3864; color: #FFFFFF; font-weight: 700; font-family: var(--font-display);
  font-size: 12.8px; border-top: 2px solid #16294A; border-bottom: 1px solid #16294A;
}
.arow-tramo td {
  background: #DCE6F5; padding-top: 7px; padding-bottom: 7px;
  border-bottom: 1px solid #C7D6EC; font-weight: 500;
}
.arow-tramo.has-conflict { background: var(--red-bg); }
.arow-tramo.has-conflict td { background: transparent; }
.arow-persona td { color: var(--text-muted); font-size: 12px; padding-top: 3px; padding-bottom: 3px; }
.acap-cell { font-weight: 700; }
.amodal-cell { font-weight: 600; }
.atema-cell { padding-left: 14px !important; font-weight: 600; cursor: pointer; }
.atema-cell:hover { text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.apersona-cell { padding-left: 30px !important; }
.persona-name-wrap { display: flex; align-items: center; gap: 5px; }
.persona-name-wrap input.cell-input { flex: 1; width: auto; min-width: 60px; }
.tramo-warn { color: var(--red); font-size: 11px; margin-top: 3px; font-weight: 500; }

/* ---------- Gantt ---------- */
.gantt-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 14px; flex-wrap: wrap; }
.gantt-dia-controls { display: flex; gap: 10px; align-items: center; }
.gantt-shared-controls { display: flex; gap: 10px; align-items: center; }
.gantt-legend { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; font-size: 11.5px; color: var(--text-muted); }
.legend-swatch { display: inline-flex; align-items: center; gap: 5px; }
.legend-swatch i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

.gantt-dia { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: auto; }
.gantt-grid { position: relative; min-width: 900px; }
.gantt-hours { display: grid; background: var(--panel-2); border-bottom: 1px solid var(--line); }
.gantt-hour-label { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-dim); padding: 6px 0 6px 4px; border-left: 1px solid var(--line-soft); }
.gantt-lane-row { display: grid; border-top: 1px solid var(--line-soft); min-height: 58px; position: relative; }
.gantt-lane-label {
  position: sticky; left: 0; background: var(--panel); z-index: 2;
  padding: 6px 10px; font-size: 12px; color: var(--text-muted); border-right: 1px solid var(--line);
  display: flex; align-items: center;
}
.gantt-track { position: relative; }
.gantt-vline { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line-soft); }
.gantt-bar {
  position: absolute; top: 5px; bottom: 5px; border-radius: 5px;
  padding: 4px 8px; color: #0D0D0D;
  overflow: hidden;
  box-shadow: 0 1px 2px rgba(0,0,0,0.18);
  border: 1px solid rgba(0,0,0,0.15);
  cursor: pointer;
  display: flex; flex-direction: column; justify-content: center; gap: 2px;
}
.gantt-bar-tema {
  font-size: 11px; font-weight: 700; line-height: 1.2;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.gantt-bar-cap {
  font-size: 10px; font-weight: 500; line-height: 1.2; opacity: 0.75;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.gantt-bar.conflict { outline: 2px solid var(--red); outline-offset: 1px; }
.gantt-empty-lanes { padding: 30px; text-align: center; color: var(--text-muted); }

.gantt-mes { display: flex; flex-direction: column; gap: 6px; }
.gantt-mes[hidden], .gantt-dia[hidden] { display: none; }
.gm-row { display: grid; grid-template-columns: 130px 1fr 90px; align-items: center; gap: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 10px 14px; cursor: pointer; }
.gm-row:hover { border-color: var(--text-dim); }
.gm-date { font-family: var(--font-mono); font-size: 12.5px; }
.gm-bar-wrap { display: flex; height: 16px; border-radius: 4px; overflow: hidden; background: var(--line-soft); gap: 1.5px; }
.gm-seg { height: 100%; }
.gm-counts { text-align: right; font-size: 11.5px; color: var(--text-muted); }
.gm-counts b { color: var(--red); }

/* ---------- Modal ---------- */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(18,24,32,0.45); backdrop-filter: blur(2px);
  display: flex; align-items: flex-start; justify-content: center; z-index: 100; padding: 40px 20px; overflow: auto;
}
.modal-backdrop[hidden] { display: none; }
.modal-card {
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  width: 100%; max-width: 640px; padding: 20px 22px; box-shadow: 0 20px 50px rgba(20,30,45,0.22);
}
.modal-title { font-family: var(--font-display); font-size: 16px; font-weight: 600; margin-bottom: 4px; }
.modal-sub { font-size: 12px; color: var(--text-muted); margin-bottom: 16px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-field { display: flex; flex-direction: column; gap: 5px; }
.form-field.full { grid-column: 1 / -1; }
.form-field label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; }
.form-field .input { width: 100%; }

.modal-actions { display: flex; justify-content: space-between; margin-top: 18px; gap: 10px; }
.attendees-editor { border: 1px solid var(--line); border-radius: 6px; padding: 10px; max-height: 160px; overflow: auto; }
.attendee-chip { display: inline-flex; align-items: center; gap: 6px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 14px; padding: 3px 6px 3px 10px; font-size: 11.5px; margin: 3px; }
.attendee-chip button { background: none; border: none; color: var(--text-dim); font-size: 13px; }

/* ---------- Toast ---------- */
.toast {
  position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
  background: #1D2530; border: 1px solid #2A3542; color: #F5F7FA;
  padding: 10px 18px; border-radius: 8px; font-size: 12.8px; z-index: 200;
  box-shadow: 0 8px 24px rgba(20,30,45,0.3);

  .kpi-row { grid-template-columns: repeat(3, 1fr); }

<div id="app">

  <header class="topbar">

          <rect x="1" y="1" width="28" height="28" rx="6" stroke="var(--red)" stroke-width="1.6"/>
          <path d="M8 20 L8 13 M15 20 L15 9 M22 20 L22 15.5" stroke="var(--red)" stroke-width="2" stroke-linecap="round"/>
          <circle cx="15" cy="9" r="1.6" fill="var(--amber)"/>

      </div>
      <div class="brand-text">
        <div class="brand-title">Centro de Control · ADELCA</div>
        <div class="brand-sub">Planificación de Capacitaciones SAP · Alóag · Milagro · Calderón</div>
      </div>
    </div>

      <button class="tab-btn active" data-tab="agenda" role="tab" aria-selected="true">Agenda Reunión</button>

      <span id="saveState" class="save-state">Sincronizado</span>

        <span class="refresh-icon">⟳</span> Actualizar
      </button>
    </div>
  </header>

  <main>

    <div id="globalDatalists" style="display:none"></div>

    <!-- ================= TAB: AGENDA REUNION ================= -->
    <section id="tab-agenda" class="tab-panel active">

          </div>
          <select id="fModuloAgenda" class="input select-input"><option value="">Módulo: todos</option></select>
          <select id="fLocalidadAgenda" class="input select-input"><option value="">Localidad: todas</option></select>
          <select id="fEstadoAgenda" class="input select-input"><option value="">Estado: todos</option></select>
          <button id="btnAgendaOnlyConflicts" class="btn btn-ghost btn-incidencias" title="Mostrar solo grupos y tramos con alertas de conflicto">⚠ Solo incidencias</button>
        </div>
        <div class="tb-group tb-actions">
          <button id="btnNuevaSesion" class="btn btn-amber" title="Crea una sesión con varios participantes a la vez">+ Nueva sesión (grupo)</button>
          <button id="btnExportCsv" class="btn btn-ghost">Exportar CSV</button>
        </div>
        <div class="agenda-stats" id="agendaStats"></div>
      </div>

      <div class="tema-search-row">
        <input id="temaSearch" class="input tema-search-input" type="search" placeholder="Buscar un tema en todas las fechas… (ej. aprovisionamiento)">
      </div>
      <div id="temaSearchResults" class="tema-search-results" hidden></div>

      <div class="kpi-row" id="kpiRow"></div>

      <div id="agendaAlertsList" class="alerts-chips"></div>

      <div id="agendaMainView">
        <div class="table-wrap">
          <table class="data-table">
            <thead id="agendaThead"></thead>
            <tbody id="agendaTbody"></tbody>
          </table>
          <div id="agendaEmpty" class="empty-state" hidden>
            <p>No hay sesiones programadas para esta fecha.</p>
          </div>
        </div>
      </div>
    </section>

    <!-- ================= TAB: GANTT ================= -->
    <section id="tab-gantt" class="tab-panel">
      <div class="gantt-head">
        <div class="view-toggle" role="group" aria-label="Vista de Gantt">
          <button class="gt-btn active" data-gview="dia">Vista día</button>
          <button class="gt-btn" data-gview="mes">Vista mes</button>
        </div>
        <div class="gantt-shared-controls">
          <select id="fLocalidadGantt" class="input select-input"><option value="">Localidad: todas</option></select>
          <input id="fTemaGantt" class="input" list="dl-tema-gantt" placeholder="Filtrar por tema…" style="min-width:220px;">
          <datalist id="dl-tema-gantt"></datalist>
        </div>
        <div id="ganttDiaControls" class="gantt-dia-controls">
          <select id="ganttFecha" class="input select-input"></select>
          <div class="view-toggle" role="group" aria-label="Agrupar por">
            <button class="gl-btn active" data-glane="sala">Por sala</button>
            <button class="gl-btn" data-glane="capacitador">Por capacitador</button>
          </div>
        </div>
      </div>
      <div id="ganttLegend" class="gantt-legend"></div>
      <div id="ganttDia" class="gantt-dia"></div>
      <div id="ganttMes" class="gantt-mes" hidden></div>
    </section>

  </main>

  <div id="modalBackdrop" class="modal-backdrop" hidden>
    <div id="modalCard" class="modal-card" role="dialog" aria-modal="true"></div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <div id="authGate" class="auth-gate" hidden>
    <div class="auth-card">
      <div class="auth-mark">
        <svg width="34" height="34" viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="1" y="1" width="28" height="28" rx="6" stroke="var(--red)" stroke-width="1.6"/>
          <path d="M8 20 L8 13 M15 20 L15 9 M22 20 L22 15.5" stroke="var(--red)" stroke-width="2" stroke-linecap="round"/>
          <circle cx="15" cy="9" r="1.6" fill="var(--amber)"/>
        </svg>
      </div>
      <div class="auth-title">Centro de Control · ADELCA</div>

      <button id="authSubmit" class="btn btn-amber auth-submit">Entrar</button>
    </div>
  </div>

</div>

/* ---------------- decode compact dataset ---------------- */
function decodeRegistro(compact) {
  const L = compact.lists;
  const idx = {};
  compact.cols.forEach((c, i) => idx[c] = i);
  return compact.rows.map(r => {
    let codigo = r[idx.codigo];
    // El Excel original trae "#N/D" en Código cuando no encontró a la persona en la
    // nómina (18 filas). Eso rompía el guardado en Supabase (columna numérica) — se
    // normaliza a "sin código" en vez de forzar un valor de texto en un campo numérico.
    if (typeof codigo !== 'number' || !Number.isFinite(codigo)) codigo = null;
    return {
      id: r[idx.id],
      capacitador: L.cap[r[idx.cap]] ?? null,
      modulo: L.mod[r[idx.mod]] ?? null,
      tema: L.tema[r[idx.tema]] ?? null,
      nombre: L.nombre[r[idx.nombre]] ?? null,
      codigo,
      unidad: L.unidad[r[idx.unidad]] ?? null,
      localidad: L.loc[r[idx.loc]] ?? null,
      lugar: L.lugar[r[idx.lugar]] ?? null,
      modalidad: L.modal[r[idx.modal]] ?? null,
      fecha: L.fecha[r[idx.fecha]] ?? null,
      hora: r[idx.hora],
      horaFin: r[idx.horaFin],
      duracion: r[idx.dur],
      requisitos: L.req[r[idx.req]] ?? null,
      observaciones: L.obs[r[idx.obs]] ?? null,
      estado: L.estado[r[idx.estado]] ?? null,
      sala: L.sala[r[idx.sala]] ?? null,
    };
  });
}

/* ---------------- mapeo fila <-> tabla de Supabase ---------------- */
function toDbRow(r) {
  let codigo = r.codigo;
  if (typeof codigo !== 'number' || !Number.isFinite(codigo)) codigo = null;
  return {
    id: r.id, capacitador: r.capacitador, modulo: r.modulo, tema: r.tema, nombre: r.nombre,
    codigo, unidad: r.unidad, localidad: r.localidad, lugar: r.lugar, modalidad: r.modalidad,
    fecha: r.fecha || null, hora: r.hora || null, hora_fin: r.horaFin || null,
    requisitos: r.requisitos, observaciones: r.observaciones, estado: r.estado, sala: r.sala,
  };
}
function fromDbRow(d) {
  return {
    id: d.id, capacitador: d.capacitador, modulo: d.modulo, tema: d.tema, nombre: d.nombre,
    codigo: d.codigo, unidad: d.unidad, localidad: d.localidad, lugar: d.lugar, modalidad: d.modalidad,
    fecha: d.fecha, hora: d.hora, horaFin: d.hora_fin,
    requisitos: d.requisitos, observaciones: d.observaciones, estado: d.estado, sala: d.sala,
  };
}

function updateSyncLabel() {
  const el = document.getElementById('saveState');
  if (!el) return;
  el.classList.remove('saving');
  if (supabaseClient) {
    if (STATE.lastSaveError) {
      el.textContent = '⚠ Error al guardar en Supabase';
      el.classList.add('sync-error');
    } else {
      el.textContent = 'Sincronizado con Supabase';
      el.classList.remove('sync-error');
    }
  } else {
    el.textContent = typeof window.storage !== 'undefined' ? 'Sincronizado' : 'Guardado solo en este archivo';
    el.classList.remove('sync-error');
  }
}

/* Botón "Actualizar": trae de una vez lo que hay AHORA MISMO en Supabase, sin esperar
   a Realtime ni recargar toda la página — pensado para poder confirmar con certeza
   qué quedó guardado después de un cambio, en vez de adivinar. */
function initRefreshButton() {
  const btn = document.getElementById('btnRefresh');
  if (!btn) return;
  if (!supabaseClient) { btn.hidden = true; return; }
  btn.hidden = false;
  btn.addEventListener('click', manualRefreshFromSupabase);
}

/* Se comparte entre la carga inicial y el botón "Actualizar". OJO: la versión anterior
   volvía a subir el Excel original COMPLETO (con upsert) cada vez que no podía CONFIRMAR
   la marca de "sembrado" — y como "no pude confirmarlo" incluía cualquier fallo pasajero
   de red, no solo "nunca se sembró", eso pisaba ediciones reales con los valores
   originales del Excel cada vez que esa lectura fallaba. Ese era el conflicto real entre
   el archivo incrustado y Supabase. Ahora la regla es mucho más conservadora:
     1) Si la marca SÍ está puesta -> se respeta la tabla tal cual, sin tocar nada.
     2) Si la tabla YA tiene al menos tantas filas como el Excel original -> se asume que
        ya se sembró alguna vez (solo falló la lectura/escritura de la marca) y se pone
        la marca ahora, SIN reinsertar ni pisar ninguna fila.
     3) Solo si de verdad hay menos filas que el Excel original y sin marca, se insertan
        ÚNICAMENTE los ids del Excel que todavía no existen en la tabla — nunca se
        sobrescribe una fila que ya está (aunque haya sido editada). */
async function ensureSeededAndFetch() {
  const sel = await supabaseClient.from('registro').select('*').order('id');
  if (sel.error) throw sel.error;
  const data = sel.data || [];
  const seedRows = decodeRegistro(REGISTRO_COMPACT);

  const seeded = await isSeedComplete();
  if (seeded) {
    return data.map(fromDbRow);
  }

  if (data.length >= seedRows.length) {
    markSeedComplete().catch(() => {});
    return data.map(fromDbRow);
  }

  const existingIds = new Set(data.map(r => r.id));
  const missing = seedRows.filter(r => !existingIds.has(r.id));
  if (missing.length) await seedRemote(missing);
  await markSeedComplete();
  return [...data.map(fromDbRow), ...missing];
}

async function manualRefreshFromSupabase() {
  const btn = document.getElementById('btnRefresh');
  if (!supabaseClient) { toast('No hay conexión a Supabase configurada.'); return; }

  if (STATE.dirtyIds.size > 0) {
    const proceed = confirm('Tienes cambios que todavía no se confirman como guardados. Si actualizas ahora, se reemplazan por lo que hay en Supabase y podrías perderlos. ¿Actualizar de todas formas?');
    if (!proceed) return;
  }

  btn.disabled = true;
  btn.classList.add('spinning');
  try {
    STATE.registro = await ensureSeededAndFetch();
    STATE.dirtyIds.clear();
    STATE.lastSaveError = null;
    recompute();
    refreshActiveView();
    updateSyncLabel();
    toast(`Actualizado desde Supabase — ${STATE.registro.length} filas.`);
  } catch (e) {
    const msg = describeSupabaseError(e);
    console.error('No se pudo actualizar desde Supabase:', msg, e);
    STATE.lastSaveError = e;
    updateSyncLabel();
    toast('No se pudo actualizar desde Supabase: ' + msg);
  }
  btn.disabled = false;
  btn.classList.remove('spinning');
}

/* ---------------- persistence ---------------- */
async function isSeedComplete() {
  try {
    const { data, error } = await supabaseClient.from('app_meta').select('value').eq('key', 'seed_complete').maybeSingle();
    if (error) throw error;
    return !!(data && data.value === 'true');
  } catch (e) {
    return false; // tabla app_meta no existe todavía, o algo falló: tratamos como "no confirmado"
  }
}
async function markSeedComplete() {
  try { await supabaseClient.from('app_meta').upsert({ key: 'seed_complete', value: 'true' }, { onConflict: 'key' }); }
  catch (e) { console.error('No se pudo marcar la siembra como completa:', describeSupabaseError(e), e); }
}

async function loadState() {
  if (supabaseClient) {
    try {
      STATE.registro = await ensureSeededAndFetch();
      STATE.syncMode = 'supabase';
      updateSyncLabel();
      return;
    } catch (e) {
      const msg = describeSupabaseError(e);
      console.error('No se pudo cargar desde Supabase, usando respaldo:', msg, e);
      STATE.lastSaveError = e;
      toast('No se pudo conectar a Supabase al cargar (' + msg + ') — usando datos locales.');
    }
  }
  try {
    const res = await window.storage.get('registro_v1', false);
    if (res && res.value) {
      STATE.registro = JSON.parse(res.value);
      STATE.syncMode = 'local';
      updateSyncLabel();
      return;
    }
  } catch (e) { /* key not found o storage no disponible en este contexto */ }
  STATE.registro = decodeRegistro(REGISTRO_COMPACT);
  STATE.syncMode = supabaseClient ? 'supabase' : 'local';
  await persist(true);
}

async function bulkUpsertRemote(rows) {
  if (!supabaseClient || !rows.length) return;
  const dbRows = rows.map(toDbRow);
  for (let i = 0; i < dbRows.length; i += 500) {
    const chunk = dbRows.slice(i, i + 500);
    const { error } = await supabaseClient.from('registro').upsert(chunk, { onConflict: 'id' });
    if (error) throw error;
  }
}

/* Siembra inicial todo-o-nada: si un lote falla a mitad de camino, borra los lotes que
   ya se habían insertado, para que la tabla quede vacía otra vez (y no "medio sembrada"),
   y la próxima carga la reintente completa desde cero en vez de darla por buena a medias. */
async function seedRemote(rows) {
  if (!supabaseClient || !rows.length) return;
  const dbRows = rows.map(toDbRow);
  const insertedIds = [];
  try {
    for (let i = 0; i < dbRows.length; i += 500) {
      const chunk = dbRows.slice(i, i + 500);
      const { error } = await supabaseClient.from('registro').upsert(chunk, { onConflict: 'id' });
      if (error) throw error;
      insertedIds.push(...chunk.map(r => r.id));
    }
  } catch (e) {
    if (insertedIds.length) {
      try { await supabaseClient.from('registro').delete().in('id', insertedIds); }
      catch (e2) { console.error('No se pudo deshacer la siembra parcial:', describeSupabaseError(e2), e2); }
    }
    throw e;
  }
}

async function deleteRemote(ids) {
  if (!supabaseClient || !ids || !ids.length) { STATE.lastSaveError = null; return true; }
  try {
    const { error } = await supabaseClient.from('registro').delete().in('id', ids);
    if (error) throw error;
    STATE.lastSaveError = null;
    return true;
  } catch (e) {
    console.error('No se pudo borrar en Supabase — detalle completo:', describeSupabaseError(e), e);
    STATE.lastSaveError = e;
    return false;
  }
}

async function persist(silent) {
  const el = document.getElementById('saveState');
  if (!silent && el) { el.textContent = 'Guardando…'; el.classList.add('saving'); }
  if (supabaseClient) {
    try {
      const dirtyRows = STATE.registro.filter(r => STATE.dirtyIds.has(r.id));
      if (dirtyRows.length) {
        await bulkUpsertRemote(dirtyRows);
        for (const r of dirtyRows) STATE.dirtyIds.delete(r.id);
      }
      STATE.lastSaveError = null;
    } catch (e) {
      console.error('No se pudo guardar en Supabase — detalle completo:', describeSupabaseError(e), e);
      STATE.lastSaveError = e;
      const msg = describeSupabaseError(e);
      toast('No se pudo guardar en Supabase: ' + msg);
    }
  } else {
    try { await window.storage.set('registro_v1', JSON.stringify(STATE.registro), false); }
    catch (e) { /* ignore fuera de claude.ai sin conexión configurada */ }
  }
  updateSyncLabel();
}

/* Marca una fila como "pendiente por guardar". El guardado real se dispara YA
   (ver scheduleSave), no después de una espera — un guardado retrasado corre el
   riesgo real de perderse si la persona recarga la página casi de inmediato. */
function markDirty(id) { STATE.dirtyIds.add(id); }

let persistInFlight = false;
let persistPending = false;
function scheduleSave() {
  const el = document.getElementById('saveState');
  if (el) { el.textContent = 'Guardando…'; el.classList.add('saving'); }
  if (persistInFlight) { persistPending = true; return; }
  persistInFlight = true;
  persist(true).finally(() => {
    persistInFlight = false;
    if (persistPending) { persistPending = false; scheduleSave(); }
  });
}

/* ---------------- derived data ---------------- */
function timeToMin(t) {
  if (!t) return null;
  const p = t.split(':');
  return (+p[0]) * 60 + (+p[1]);
}
function minToTime(m) {
  const h = Math.floor(m / 60), mm = m % 60;
  return String(h).padStart(2,'0') + ':' + String(mm).padStart(2,'0');
}
function overlaps(aS,aE,bS,bE) {
  if (aS==null||aE==null||bS==null||bE==null) return false;
  return aS < bE && bS < aE;
}

function buildSessions(registro) {
  const map = new Map();
  for (const row of registro) {
    const key = [row.capacitador, row.modulo, row.tema, row.fecha, row.hora, row.horaFin, row.lugar].join('§');
    if (!map.has(key)) {
      map.set(key, {
        sessionId: key,
        capacitador: row.capacitador, modulo: row.modulo, tema: row.tema,
        fecha: row.fecha, hora: row.hora, horaFin: row.horaFin,
        horaMin: timeToMin(row.hora), horaFinMin: timeToMin(row.horaFin),
        lugar: row.lugar, localidad: row.localidad, modalidad: row.modalidad,
        sala: row.sala, estado: row.estado,
        requisitos: row.requisitos, observaciones: row.observaciones,
        attendees: [], rowIds: [],
      });
    }
    const s = map.get(key);
    s.attendees.push({ id: row.id, nombre: row.nombre, codigo: row.codigo, unidad: row.unidad, localidad: row.localidad, modalidad: row.modalidad });
    s.rowIds.push(row.id);
  }
  return Array.from(map.values());
}

function computeConflicts(sessions) {
  const conflicts = [];
  const byFecha = new Map();
  for (const s of sessions) {
    if (!s.fecha) continue;
    if (!byFecha.has(s.fecha)) byFecha.set(s.fecha, []);
    byFecha.get(s.fecha).push(s);
  }
  for (const [fecha, list] of byFecha) {
    // capacitador overlaps
    const byCap = new Map();
    for (const s of list) {
      if (!s.capacitador) continue;
      if (!byCap.has(s.capacitador)) byCap.set(s.capacitador, []);
      byCap.get(s.capacitador).push(s);
    }
    for (const [cap, sess] of byCap) {
      for (let i=0;i<sess.length;i++) for (let j=i+1;j<sess.length;j++) {
        const a=sess[i], b=sess[j];
        if (overlaps(a.horaMin,a.horaFinMin,b.horaMin,b.horaFinMin)) {
          const distinctPlace = a.lugar !== b.lugar;
          conflicts.push({
            type: distinctPlace ? 'capacitador_2_lugares' : 'capacitador_solape',
            severity: distinctPlace ? 'critico' : 'medio',
            fecha, sessionIds: [a.sessionId,b.sessionId], capacitador: cap,
            label: distinctPlace ? 'Capacitador en 2 lugares' : 'Solape de horario (mismo lugar)',
            detail: `${cap}: "${a.tema}" (${a.hora}–${a.horaFin}, ${a.lugar}) se cruza con "${b.tema}" (${b.hora}–${b.horaFin}, ${b.lugar})`
          });
        }
      }
    }
    // persona overlaps
    const personSessions = new Map();
    for (const s of list) for (const att of s.attendees) {
      if (!att.codigo) continue;
      if (!personSessions.has(att.codigo)) personSessions.set(att.codigo, []);
      personSessions.get(att.codigo).push({ s, nombre: att.nombre });
    }
    for (const [codigo, entries] of personSessions) {
      for (let i=0;i<entries.length;i++) for (let j=i+1;j<entries.length;j++) {
        const a=entries[i].s, b=entries[j].s;
        if (a.sessionId===b.sessionId) continue;
        if (overlaps(a.horaMin,a.horaFinMin,b.horaMin,b.horaFinMin)) {
          conflicts.push({
            type: 'persona_choque', severity: 'critico', fecha, codigo, nombre: entries[i].nombre,
            sessionIds: [a.sessionId,b.sessionId],
            label: 'Persona citada a 2 capacitaciones',
            detail: `${entries[i].nombre}: "${a.tema}" con ${a.capacitador} (${a.hora}–${a.horaFin}) choca con "${b.tema}" con ${b.capacitador} (${b.hora}–${b.horaFin})`
          });
        }
      }
    }
    // sala overlaps
    const bySala = new Map();
    for (const s of list) {
      if (!s.sala || s.sala==='POR CONFIRMAR' || s.sala==='VIRTUAL') continue;
      if (!bySala.has(s.sala)) bySala.set(s.sala, []);
      bySala.get(s.sala).push(s);
    }
    for (const [sala, sess] of bySala) {
      for (let i=0;i<sess.length;i++) for (let j=i+1;j<sess.length;j++) {
        const a=sess[i], b=sess[j];
        if (overlaps(a.horaMin,a.horaFinMin,b.horaMin,b.horaFinMin)) {
          conflicts.push({
            type: 'sala_doble', severity: 'critico', fecha, sala,
            sessionIds: [a.sessionId,b.sessionId],
            label: 'Sala con doble reserva',
            detail: `"${sala}" reservada para "${a.tema}" (${a.hora}–${a.horaFin}) y "${b.tema}" (${b.hora}–${b.horaFin}) al mismo tiempo`
          });
        }
      }
    }
    // capacity
    for (const s of list) {
      if (!s.sala) continue;
      const info = LOOKUPS.salas.find(x => x.nombre === s.sala);
      if (info && info.capacidad != null) {
        const n = new Set(s.attendees.map(a=>a.codigo)).size;
        if (n > info.capacidad) {
          conflicts.push({
            type: 'capacidad', severity: 'alto', fecha, sessionIds: [s.sessionId], sala: s.sala,
            label: 'Capacidad insuficiente',
            detail: `"${s.tema}" tiene ${n} participantes pero "${s.sala}" tiene capacidad para ${info.capacidad}`
          });
        }
      }
    }
  }
  return conflicts;
}

function recompute() {
  STATE.sessions = buildSessions(STATE.registro);
  STATE.conflicts = computeConflicts(STATE.sessions);
  const bySession = new Map();
  for (const c of STATE.conflicts) {
    for (const sid of c.sessionIds) {
      if (!bySession.has(sid)) bySession.set(sid, []);
      bySession.get(sid).push(c);
    }
  }
  STATE.conflictsBySession = bySession;
  STATE.fechas = Array.from(new Set(STATE.sessions.filter(s=>s.fecha).map(s=>s.fecha))).sort();
  if (!STATE.agendaFecha || !STATE.fechas.includes(STATE.agendaFecha)) STATE.agendaFecha = STATE.fechas[0] || null;
  if (!STATE.ganttFecha || !STATE.fechas.includes(STATE.ganttFecha)) STATE.ganttFecha = STATE.fechas[0] || null;

  const totalAlerts = document.getElementById('alertsCount');
  if (totalAlerts) totalAlerts.textContent = STATE.conflicts.length;

  const dl = document.getElementById('globalDatalists');
  if (dl) dl.innerHTML = buildGlobalDatalists();

  checkAutoUnfilter();
}

/* Si el usuario está filtrando "solo incidencias" y una edición deja la vista sin ninguna,
   se desactiva el filtro solo para no dejarlo mirando una tabla vacía sin explicación. */
function checkAutoUnfilter() {
  if (STATE.agendaOnlyConflicts && STATE.agendaFecha) {
    const stillHas = STATE.conflicts.some(c => c.fecha === STATE.agendaFecha);
    if (!stillHas) {
      STATE.agendaOnlyConflicts = false;
      const btn = document.getElementById('btnAgendaOnlyConflicts');
      if (btn) btn.classList.remove('active');
      toast('Sin incidencias para esta fecha — mostrando toda la agenda');
    }
  }
}

function moduloColor(mod) {
  if (!MODULO_COLORS[mod]) {
    const keys = Object.keys(MODULO_COLORS).length;
    MODULO_COLORS[mod] = PALETTE[keys % PALETTE.length];
  }
  return MODULO_COLORS[mod];
}

function fmtFechaLarga(f) {
  if (!f) return '—';
  const d = new Date(f + 'T12:00:00');
  return d.toLocaleDateString('es-EC', { weekday:'long', day:'2-digit', month:'long', year:'numeric' });
}
function fmtFechaCorta(f) {
  if (!f) return '—';
  const d = new Date(f + 'T12:00:00');
  return d.toLocaleDateString('es-EC', { day:'2-digit', month:'short' });
}
function esc(s) { return (s==null?'':String(s)).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toast._h);
  toast._h = setTimeout(() => t.hidden = true, 2200);
}

/* ============================================================
   TAB: REGISTRO
   ============================================================ */
function uniqueSorted(arr) { return Array.from(new Set(arr.filter(Boolean))).sort(); }

/* Un grupo/tramo es "HÍBRIDA" cuando mezcla asistentes presenciales y virtuales —
   cada persona conserva su propia modalidad, esto solo resume el conjunto. */
function computeModalidad(attendees) {
  const vals = new Set((attendees||[]).map(a => a.modalidad).filter(v => v === 'PRESENCIAL' || v === 'VIRTUAL'));
  if (vals.size > 1) return 'HÍBRIDA';
  if (vals.size === 1) return [...vals][0];
  return (attendees && attendees[0] && attendees[0].modalidad) || '—';
}

function renderKpis() {
  const totalSesiones = STATE.sessions.length;
  const totalRegistros = STATE.registro.length;
  const personasUnicas = new Set(STATE.registro.map(r=>r.codigo)).size;
  const totalConflictos = STATE.conflicts.length;
  const sinSala = STATE.sessions.filter(s=>!s.sala || s.sala==='POR CONFIRMAR').length;
  const sinFecha = STATE.registro.filter(r=>!r.fecha).length;

  const cards = [
    ['Sesiones', totalSesiones, ''],
    ['Registros (filas)', totalRegistros, ''],
    ['Personas únicas', personasUnicas, ''],
    ['Sesiones sin sala', sinSala, 'warn'],
    ['Conflictos activos', totalConflictos, 'crit'],
    ['Filas sin fecha', sinFecha, sinFecha>0?'warn':''],
  ];
  document.getElementById('kpiRow').innerHTML = cards.map(([l,v,cls]) => `
    <div class="kpi-card ${cls}"><div class="kpi-label">${l}</div><div class="kpi-value">${v}</div></div>
  `).join('');
}

function salaOptionsHtml(selected, localidad) {
  let opts = LOOKUPS.salas.filter(s => !localidad || s.localidad === (localidad||'').replace('QUITO - ','').toUpperCase() || s.localidad===localidad);
  // fallback: if no salas matched by localidad, show all
  if (!opts.length) opts = LOOKUPS.salas;
  const names = ['POR CONFIRMAR', ...opts.map(o=>o.nombre), 'VIRTUAL'];
  const uniq = Array.from(new Set(names));
  if (selected && !uniq.includes(selected)) uniq.unshift(selected);
  return uniq.map(n => `<option value="${esc(n)}" ${n===selected?'selected':''}>${esc(n)}</option>`).join('');
}

/* ---- flat, spreadsheet-like grid: reutilizado por Agenda para las filas editables ---- */

function computeRowSessionId(row) {
  return [row.capacitador, row.modulo, row.tema, row.fecha, row.hora, row.horaFin, row.lugar].join('§');
}

function rowDuracionText(row) {
  const a = timeToMin(row.hora), b = timeToMin(row.horaFin);
  if (a==null || b==null || b<=a) return '—';
  const h = (b-a)/60;
  return (Math.round(h*10)/10).toString();
}

function getRowConflicts(row) {
  const sid = computeRowSessionId(row);
  const all = STATE.conflictsBySession.get(sid) || [];
  return all.filter(c => c.type !== 'persona_choque' || c.codigo === row.codigo);
}

function shortConflictText(c, currentSessionId) {
  const otherId = c.sessionIds.find(id => id !== currentSessionId) ?? c.sessionIds[0];
  const other = STATE.sessions.find(s => s.sessionId === otherId);
  const when = other ? `${other.hora}–${other.horaFin}` : '';
  const otherTema = other ? other.tema : '';
  switch (c.type) {
    case 'persona_choque': return `${c.nombre}: choca con "${otherTema}" (${when})`;
    case 'capacitador_2_lugares': return `También en "${otherTema}" (${when}${other?', '+other.lugar:''})`;
    case 'capacitador_solape': return `Solape con "${otherTema}" (${when})`;
    case 'sala_doble': return `Sala también reservada para "${otherTema}" (${when})`;
    case 'capacidad': return c.detail;
    default: return c.label;
  }
}

function alertCellHtml(row) {
  const cs = getRowConflicts(row);
  return conflictBadgeFromList(cs);
}

function buildGlobalDatalists() {
  const mk = (id, values) => `<datalist id="${id}">${values.slice(0,1500).map(v=>`<option value="${esc(v)}">`).join('')}</datalist>`;
  // Nombre/Unidad/Localidad se completan con la nómina entera (EMPLEADOS), no solo con
  // quien ya aparece en Registro — mismo motivo que el buscador del modal de sesión.
  const nombresTodos = uniqueSorted([...EMPLEADOS.map(e=>e.nombre), ...STATE.registro.map(r=>r.nombre)]);
  const unidadesTodas = uniqueSorted([...EMPLEADOS.map(e=>e.unidad), ...STATE.registro.map(r=>r.unidad)]);
  const localidadesTodas = uniqueSorted([...EMPLEADOS.map(e=>e.localidad), ...STATE.registro.map(r=>r.localidad)]);
  return [
    mk('dl-cap-g', uniqueSorted(STATE.registro.map(r=>r.capacitador))),
    mk('dl-mod-g', uniqueSorted(STATE.registro.map(r=>r.modulo))),
    mk('dl-nombre-g', nombresTodos),
    mk('dl-unidad-g', unidadesTodas),
    mk('dl-loc-g', localidadesTodas),
    mk('dl-lugar-g', uniqueSorted(STATE.registro.map(r=>r.lugar))),
  ].join('');
}

/* ---- plantilla de tabla compartida entre Registro y Agenda Reunión (misma grilla en ambas) ---- */
function wireEditableRows(tbody) {
  tbody.querySelectorAll('.cell-input').forEach(el => el.addEventListener('change', onCellCommit));
  tbody.querySelectorAll('[data-dup]').forEach(el => el.addEventListener('click', () => duplicateRow(+el.dataset.dup)));
  tbody.querySelectorAll('[data-del]').forEach(el => el.addEventListener('click', () => {
    if (confirm('¿Eliminar esta fila del Registro?')) deleteRow(+el.dataset.del);
  }));
}

function onCellCommit(e) {
  const el = e.target;
  const tbodyEl = el.closest('tbody');
  const id = +el.dataset.id;
  const field = el.dataset.field;
  let value = el.value;
  if (field === 'codigo') value = value===''? null : Number(value);
  else if (typeof value === 'string') value = value.trim();
  const row = STATE.registro.find(r => r.id === id);
  if (!row) return;
  row[field] = (value === '' ? null : value);
  markDirty(id);
  recompute();
  scheduleSave();

  const durEl = tbodyEl.querySelector(`[data-dur-for="${id}"]`);
  if (durEl) durEl.textContent = rowDuracionText(row);
  if (field === 'localidad') {
    const salaSel = tbodyEl.querySelector(`tr[data-id="${id}"] select[data-field="sala"]`);
    if (salaSel) salaSel.innerHTML = salaOptionsHtml(row.sala, row.localidad);
  }
  refreshConflictIndicatorsIn(tbodyEl);
  renderKpis();
}

function refreshConflictIndicatorsIn(tbodyEl) {
  tbodyEl.querySelectorAll('tr[data-id]').forEach(tr => {
    const id = +tr.dataset.id;
    const row = STATE.registro.find(r=>r.id===id);
    if (!row) return;
    const cs = getRowConflicts(row);
    tr.classList.toggle('has-conflict', cs.length>0);
    const cell = tbodyEl.querySelector(`[data-alert-for="${id}"]`);
    if (cell) cell.innerHTML = alertCellHtml(row);
  });
}

async function duplicateRow(id) {
  const idx = STATE.registro.findIndex(r=>r.id===id);
  if (idx===-1) return;
  const newRow = { ...STATE.registro[idx], id: nextId() };
  STATE.registro.splice(idx+1, 0, newRow);
  markDirty(newRow.id);
  recompute();
  refreshActiveView();
  await persist(false);
  toast(STATE.lastSaveError ? 'No se pudo confirmar la copia — revisa la conexión' : 'Fila duplicada y confirmada — edita el participante');
}

async function deleteRow(id) {
  STATE.registro = STATE.registro.filter(r=>r.id!==id);
  STATE.dirtyIds.delete(id);
  recompute();
  refreshActiveView();
  const ok = await deleteRemote([id]);
  toast(ok ? 'Fila eliminada y confirmada' : 'No se pudo confirmar el borrado — revisa la conexión');
}

function exportCsv() {
  const headers = ['id','fecha','hora','horaFin','modulo','tema','capacitador','nombre','codigo','unidad','localidad','lugar','sala','modalidad','estado','requisitos','observaciones'];
  const lines = [headers.join(',')];
  for (const r of STATE.registro) {
    lines.push(headers.map(h => {
      let v = r[h]; if (v==null) v='';
      v = String(v).replace(/"/g,'""');
      return /[,"\n]/.test(v) ? `"${v}"` : v;
    }).join(','));
  }
  const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'registro_capacitaciones.csv';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

/* ---------------- session mutation helpers ---------------- */
async function deleteSession(sessionId) {
  const removedIds = STATE.registro.filter(r => computeRowSessionId(r) === sessionId).map(r=>r.id);
  STATE.registro = STATE.registro.filter(r => computeRowSessionId(r) !== sessionId);
  removedIds.forEach(id => STATE.dirtyIds.delete(id));
  recompute();
  refreshActiveView();
  const ok = await deleteRemote(removedIds);
  toast(ok ? 'Sesión eliminada y confirmada' : 'No se pudo confirmar el borrado — revisa la conexión');
}

function nextId() {
  return STATE.registro.reduce((m,r)=>Math.max(m,r.id||0), 0) + 1;
}

function refreshActiveView() {
  const active = document.querySelector('.tab-btn.active').dataset.tab;
  if (active === 'agenda') renderAgenda();
  if (active === 'gantt') renderGantt();
}

function findParticipantDirectory() {
  const map = new Map();
  // Base: la nómina completa de la empresa (hoja BD, ~1,300 personas) — así se puede
  // agregar a CUALQUIER empleado a una capacitación, no solo a quien ya tenía alguna
  // asignada antes (ese era el bug: alguien nuevo en el sistema no aparecía nunca).
  for (const e of EMPLEADOS) {
    if (e.codigo != null) map.set(e.codigo, { codigo: e.codigo, nombre: e.nombre, unidad: e.unidad, localidad: e.localidad });
  }
  // Por si acaso: alguien que ya está en Registro pero no en la nómina (dato faltante en BD).
  for (const r of STATE.registro) {
    if (r.codigo!=null && !map.has(r.codigo)) map.set(r.codigo, { codigo:r.codigo, nombre:r.nombre, unidad:r.unidad, localidad:r.localidad });
  }
  return Array.from(map.values()).sort((a,b)=> (a.nombre||'').localeCompare(b.nombre||''));
}
